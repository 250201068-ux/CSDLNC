version: "3.8"

services:
  node1-validator:
    image: ethereum/client-go:v1.13.15
    container_name: eth-node1-validator
    hostname: node1
    networks:
      - eth-private-net
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    volumes:
      - ./genesis.json:/genesis.json
      - ./password.txt:/password.txt
      - ./keystore:/keystore
      - ./static-nodes.json:/root/.ethereum/static-nodes.json
      - node1-data:/root/.ethereum
    entrypoint: /bin/sh
    command: >
      -c "
      if [ ! -d /root/.ethereum/keystore ] || [ -z \"$$(ls -A /root/.ethereum/keystore 2>/dev/null)\" ]; then
        echo 'Initializing genesis...';
        geth init --datadir /root/.ethereum /genesis.json;
        echo 'Copying keystore...';
        mkdir -p /root/.ethereum/keystore;
        cp -r /keystore/* /root/.ethereum/keystore/ 2>/dev/null || true;
      fi;
      exec geth
      --networkid 2025
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,personal,miner,admin,debug,clique
      --http.corsdomain '*'
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8546
      --ws.api eth,net,web3,personal,miner,admin,debug,clique
      --ws.origins '*'
      --datadir /root/.ethereum
      --allow-insecure-unlock
      --mine
      --miner.etherbase 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      --unlock 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
      --password /password.txt
      --nodiscover
      --maxpeers 25
      --verbosity 3
      --rpc.allow-unprotected-txs
      "

  node2-full:
    image: ethereum/client-go:v1.13.15
    container_name: eth-node2-full
    hostname: node2
    networks:
      - eth-private-net
    ports:
      - "8547:8545"
      - "8548:8546"
      - "30304:30303"
    volumes:
      - ./genesis.json:/genesis.json
      - ./static-nodes.json:/root/.ethereum/static-nodes.json
      - node2-data:/root/.ethereum
    entrypoint: /bin/sh
    command: >
      -c "
      if [ ! -f /root/.ethereum/genesis_initialized ]; then
        geth init --datadir /root/.ethereum /genesis.json;
        touch /root/.ethereum/genesis_initialized;
      fi;
      exec geth
      --networkid 2025
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,personal,admin,debug
      --http.corsdomain '*'
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8546
      --ws.api eth,net,web3,personal,admin,debug
      --ws.origins '*'
      --datadir /root/.ethereum
      --allow-insecure-unlock
      --nodiscover
      --maxpeers 25
      --verbosity 3
      "
    depends_on:
      - node1-validator

  node3-recovery:
    image: ethereum/client-go:v1.13.15
    container_name: eth-node3-recovery
    hostname: node3
    networks:
      - eth-private-net
    ports:
      - "8549:8545"
      - "8550:8546"
      - "30305:30303"
    volumes:
      - ./genesis.json:/genesis.json
      - ./static-nodes.json:/root/.ethereum/static-nodes.json
      - node3-data:/root/.ethereum
    entrypoint: /bin/sh
    command: >
      -c "
      if [ ! -f /root/.ethereum/genesis_initialized ]; then
        geth init --datadir /root/.ethereum /genesis.json;
        touch /root/.ethereum/genesis_initialized;
      fi;
      exec geth
      --networkid 2025
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,personal,admin,debug
      --http.corsdomain '*'
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8546
      --ws.api eth,net,web3,personal,admin,debug
      --ws.origins '*'
      --datadir /root/.ethereum
      --allow-insecure-unlock
      --nodiscover
      --maxpeers 25
      --verbosity 3
      "
    depends_on:
      - node1-validator

  node4-observer:
    image: ethereum/client-go:v1.13.15
    container_name: eth-node4-observer
    hostname: node4
    networks:
      - eth-private-net
    ports:
      - "8551:8545"
      - "8552:8546"
      - "30306:30303"
    volumes:
      - ./genesis.json:/genesis.json
      - ./static-nodes.json:/root/.ethereum/static-nodes.json
      - node4-data:/root/.ethereum
    entrypoint: /bin/sh
    command: >
      -c "
      if [ ! -f /root/.ethereum/genesis_initialized ]; then
        geth init --datadir /root/.ethereum /genesis.json;
        touch /root/.ethereum/genesis_initialized;
      fi;
      exec geth
      --networkid 2025
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,personal,admin,debug
      --http.corsdomain '*'
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8546
      --ws.api eth,net,web3,personal,admin,debug
      --ws.origins '*'
      --datadir /root/.ethereum
      --allow-insecure-unlock
      --nodiscover
      --syncmode full
      --maxpeers 25
      --verbosity 3
      "
    depends_on:
      - node1-validator

  node5-rogue:
    image: ethereum/client-go:v1.13.15
    container_name: eth-node5-rogue
    hostname: node5
    networks:
      - eth-private-net
    ports:
      - "8553:8545"
      - "8554:8546"
      - "30307:30303"
    volumes:
      - ./genesis.json:/genesis.json
      - ./static-nodes.json:/root/.ethereum/static-nodes.json
      - node5-data:/root/.ethereum
    entrypoint: /bin/sh
    command: >
      -c "
      if [ ! -f /root/.ethereum/genesis_initialized ]; then
        geth init --datadir /root/.ethereum /genesis.json;
        touch /root/.ethereum/genesis_initialized;
      fi;
      exec geth
      --networkid 2025
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,personal,admin,debug
      --http.corsdomain '*'
      --ws
      --ws.addr 0.0.0.0
      --ws.port 8546
      --ws.api eth,net,web3,personal,admin,debug
      --ws.origins '*'
      --datadir /root/.ethereum
      --allow-insecure-unlock
      --nodiscover
      --syncmode full
      --maxpeers 25
      --verbosity 3
      "
    depends_on:
      - node1-validator

  backend:
    build:
      context: ../java-app
      dockerfile: Dockerfile
    container_name: blockchain-backend
    networks:
      - eth-private-net
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - ETHEREUM_NODE1_URL=http://eth-node1-validator:8545
      - ETHEREUM_NODE2_URL=http://eth-node2-full:8545
      - ETHEREUM_NODE3_URL=http://eth-node3-recovery:8545
      - ETHEREUM_NODE4_URL=http://eth-node4-observer:8545
      - ETHEREUM_NODE5_URL=http://eth-node5-rogue:8545
    depends_on:
      - node1-validator
      - node2-full
      - node3-recovery
      - node4-observer
      - node5-rogue
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: blockchain-frontend
    networks:
      - eth-private-net
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  eth-private-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
